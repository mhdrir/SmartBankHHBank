# CI/CD pipeline (GitHub Actions)
#
#  on every push / pull request:  build -> unit tests -> integration tests (Testcontainers) -> Docker image
#  on push to main (optional):    push the image to AWS ECR using OIDC (no long-lived AWS keys in GitHub)
#
# Banking angle: every change goes through the same automated checks; main is protected and needs a
# reviewed pull request (four-eyes principle for code); the pipeline log is the audit trail.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write          # needed for OIDC login to AWS

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven     # caches ~/.m2 between runs

      # verify = compile + unit tests (surefire) + integration tests (failsafe, Docker is available on ubuntu runners)
      - name: Build and test
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

      - name: Build Docker image
        run: docker build -t smartbank-payments:${{ github.sha }} .

      # ---- Delivery to AWS (only if the repository variable AWS_ROLE_ARN is configured) ----
      - name: Configure AWS credentials (OIDC)
        if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Push image to ECR
        if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
        run: |
          REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.eu-central-1.amazonaws.com
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          docker tag smartbank-payments:${{ github.sha }} "$REGISTRY/smartbank-payments:${{ github.sha }}"
          docker push "$REGISTRY/smartbank-payments:${{ github.sha }}"
